<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fun - Dalia Gamal</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        #hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .hero-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            max-width: 1100px;
            width: 100%;
        }

        .hero-left {
            flex: 1;
            text-align: left;
        }

        .hero-left .avatar {
            width: 90px;
            margin-bottom: 12px;
        }

        .hero-right {
            flex-shrink: 0;
            text-align: center;
        }

        .phone-frame {
            width: 220px;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            border: 5px solid #1a1a1a;
        }

        .phone-frame video {
            width: 100%;
            display: block;
            aspect-ratio: 9 / 16;
            object-fit: cover;
        }

        .video-caption {
            margin-top: 10px;
            font-style: italic;
            opacity: 0.8;
            font-size: 0.85rem;
        }

        .ai-fun-btn {
            display: inline-block;
            margin: 16px 8px 0 0;
            padding: 9px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
        }

        .ai-fun-btn.filled {
            background: #7b2ff7;
            color: #fff;
        }

        .ai-fun-btn.outline {
            background: transparent;
            border: 2px solid #7b2ff7;
            color: #7b2ff7;
        }

        @media (max-width: 700px) {
            #hero {
                min-height: auto;
                padding: 90px 16px 30px;
            }
            .hero-content {
                flex-direction: column;
                text-align: center;
            }
            .hero-left {
                text-align: center;
            }
            .phone-frame {
                width: 180px;
            }
        }
    </style>
</head>
<body>
    <!-- Header / Navigation -->
    <header id="main-header">
        <nav id="nav-menu" class="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Me</a></li>
                <li><a href="experience.html">Experience</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="ai-automation.html">AI Fun</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section: Left text, Right video -->
    <header id="hero">
        <div class="hero-content">
            <div class="hero-left">
                <img src="avatar-cartoon.png" alt="Dalia Avatar" class="avatar">
                <h1>🎬 AI Fun</h1>
                <p>
                    I asked an AI "CEO" to give me a reference.<br>
                    He agreed. He's not real. Enjoy ✨
                </p>
                <a href="https://github.com/DaliaGamal11" target="_blank" class="ai-fun-btn filled">Explore GitHub</a>
                <a href="index.html" class="ai-fun-btn outline">Back to Home</a>
            </div>

            <div class="hero-right">
                <div class="phone-frame">
                    <video controls playsinline poster="avatar-cartoon.png">
                        <source src="Dalia Gamal_ AI Portfolio Intro_1080p.mp4" type="video/mp4">
                        Your browser doesn't support video playback.
                    </video>
                </div>
                <p class="video-caption">100% AI-generated CEO. Still a fan though.</p>
            </div>
        </div>
    </header>

    <footer style="text-align:center; padding: 10px;">
        <p>&copy; 2026 Dalia Gamal</p>
    </footer>
</body>
</html>
