<head>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

<style>
/* Reset */
* {margin:0; padding:0; box-sizing:border-box;}
body {font-family:'Roboto',sans-serif; background:#f5f5f5; color:#222; overflow-x:hidden;}

/* Header */
#main-header {
  position: fixed; top:0; width:100%; padding:1rem 2rem;
  display:flex; justify-content:center; align-items:center;
  background: linear-gradient(135deg,#6A1B9A,#AB47BC,#CE93D8);
  color:#fff; z-index:10; font-family:'Poppins',sans-serif;
}
.nav-menu ul {display:flex; list-style:none; gap:2rem; justify-content:center;}
.nav-menu a {color:#fff; font-weight:600; transition:0.3s; text-decoration:none;}
.nav-menu a.active, .nav-menu a:hover {color:#FFD700;}

/* Hero + horizontal layout */
#hero {
  display:flex; align-items:center; justify-content:center; min-height:100vh;
  background: linear-gradient(135deg,#6A1B9A,#AB47BC,#CE93D8);
  color:#fff; padding:2rem;
}
.hero-left, .hero-right {
  flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;
}
.hero-left {align-items:center;}
.hero-left .avatar {width:180px; border-radius:50%; border:4px solid #fff; animation: float 4s ease-in-out infinite;}
@keyframes float {0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}

/* Floating shapes */
.floating-shapes .shape {position:absolute; border-radius:50%; opacity:0.3;}
.circle {width:80px;height:80px;background:#BA68C8;top:20%;left:10%; animation:move1 6s infinite alternate;}
.triangle {width:60px;height:60px;background:#9C27B0;clip-path:polygon(50% 0%,0% 100%,100% 100%);top:40%;left:70%; animation:move2 5s infinite alternate;}
.blob {width:100px;height:100px;background:#8E24AA;border-radius:40% 60% 60% 40%; top:70%; left:30%; animation:move3 7s infinite alternate;}
@keyframes move1 {0%{transform:translateY(0);}100%{transform:translateY(20px);}}
@keyframes move2 {0%{transform:translateX(0);}100%{transform:translateX(-20px);}}
@keyframes move3 {0%{transform:translate(0,0);}100%{transform:translate(20px,-10px);}}

/* Right side content */
.hero-right {align-items:center; padding-left:2rem;}
.hero-right h1 {font-family:'Poppins',sans-serif; font-size:2rem; margin-bottom:1rem;}
.hero-right p {margin-bottom:1.5rem; font-size:1.1rem; line-height:1.4; text-align:center;}
.cta-btn {padding:.5rem 1.2rem; background:#FFD700; color:#6A1B9A; font-weight:600; border-radius:25px; transition:0.3s; text-decoration:none; display:inline-block; margin:0 6px;}
.cta-btn:hover {transform:scale(1.05); background:#FFB300;}
.cta-btn.outline-btn {background:transparent; border:2px solid #fff; color:#fff;}
.cta-btn.outline-btn:hover {background:rgba(255,255,255,0.15);}

/* Phone video frame */
.phone-frame {
  width: 220px;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  border: 5px solid #fff;
  margin-bottom: 1rem;
}
.phone-frame video {
  width: 100%;
  display: block;
  aspect-ratio: 9 / 16;
  object-fit: cover;
}
.video-caption {
  font-size: 0.85rem;
  font-style: italic;
  opacity: 0.9;
  margin-bottom: 1rem;
}

/* Footer */
footer {padding:1rem; text-align:center; color:#fff; background:#6A1B9A; margin-top:2rem;}

/* Responsive */
@media (max-width: 800px) {
  #hero {flex-direction:column; min-height:auto; padding:6rem 1.5rem 2rem;}
  .hero-right {padding-left:0; margin-top:1.5rem;}
}
</style>
</head>
